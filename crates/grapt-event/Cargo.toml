[package]
name = "grapt-event"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Canonical event encoding and hashing for the Grapt Rust reconstruction, per the D1-validated canonical-bytes spec."

[dependencies]
grapt-types = { path = "../grapt-types" }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true, features = ["bundled"] }
trybuild = { workspace = true }

[lints]
workspace = true
