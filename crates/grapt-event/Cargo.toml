[package]
name = "grapt-event"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Canonical event encoding and hashing for the Grapt Rust reconstruction, per the D1-validated canonical-bytes spec."

[dependencies]
grapt-types = { path = "../grapt-types" }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
trybuild = "1.0.120"

[lints]
workspace = true
