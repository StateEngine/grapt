[package]
name = "grapt-location"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Location-owned bind intent and listener acquisition: typed bind host/port, positive bind bounds, an injected bounded name resolver, and a single-owner non-clone BoundListener with a truthful bind receipt. Owns no HTTP, routes, authentication, DTOs or process supervision."

# Only what BINDING needs. `net` is the whole production surface: the crate
# acquires a listening socket and hands it on. No `rt`, `time`, `macros` or
# `sync` feature is enabled for production because nothing here schedules,
# reads a clock or spawns.
[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["net"] }

# `rt` and `macros` exist only so `#[tokio::test]` can drive the async bind
# surface; `net` additionally gives the tests `TcpStream`, which is how a held
# listener is proved undamaged after a conflicting bind without this crate
# growing an accept API it does not own.
[dev-dependencies]
tokio = { workspace = true, default-features = true, features = ["net", "rt", "macros"] }
trybuild = { workspace = true }
# Reads the R4H-L acceptance corpus in tests/acceptance_corpus.rs. Already a
# dev-dependency of thirteen sibling crates at the admitted base, so this edge
# adds no package to the lock. A hand-rolled reader was the alternative, and a
# validator that must refuse malformed input is the last place to put one.
serde_json = { workspace = true }

[lints]
workspace = true
