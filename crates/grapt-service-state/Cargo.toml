[package]
name = "grapt-service-state"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Journaled service-owner state and revisioned recovery observations."

[dependencies]
grapt-session = { path = "../grapt-session" }
grapt-store = { path = "../grapt-store" }
grapt-event = { path = "../grapt-event" }
grapt-types = { path = "../grapt-types" }
rusqlite = { workspace = true, features = ["bundled", "functions"] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
