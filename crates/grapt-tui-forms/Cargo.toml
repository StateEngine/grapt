[package]
name = "grapt-tui-forms"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The TUI's session forms: drafts, fields, choices, validation and drawing, plus the shared multi-line editor rows."

[dependencies]
grapt-client = { path = "../grapt-client" }
grapt-tui-transcript = { path = "../grapt-tui-transcript" }
ratatui = { workspace = true, features = ["crossterm"] }
ratatui-textarea = { workspace = true, features = ["crossterm"] }
crossterm = { workspace = true, features = ["events", "bracketed-paste", "windows"] }
unicode-segmentation = { workspace = true }
serde_json = { workspace = true }

[features]
# A read-only draft view for the TUI's integration tests. Never enabled
# outside [dev-dependencies].
test-support = []

[lints]
workspace = true
