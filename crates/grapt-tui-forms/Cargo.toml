[package]
name = "grapt-tui-forms"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The TUI's session forms: drafts, fields, choices, validation and drawing, plus the shared multi-line editor rows."

[dependencies]
grapt-client = { path = "../grapt-client" }
grapt-tui-transcript = { path = "../grapt-tui-transcript" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
ratatui-textarea = { version = "=0.9.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "bracketed-paste", "windows"] }
unicode-segmentation = "=1.13.3"
serde_json = "1"

[features]
# A read-only draft view for the TUI's integration tests. Never enabled
# outside [dev-dependencies].
test-support = []

[lints]
workspace = true
