[package]
name = "grapt-fault-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Deterministic seeded fault-injection and chaos harness for transport, SSE, and storage lifecycle testing."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
