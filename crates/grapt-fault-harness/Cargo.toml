[package]
name = "grapt-fault-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Deterministic seeded fault-injection and chaos harness for transport, SSE, and storage lifecycle testing."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
