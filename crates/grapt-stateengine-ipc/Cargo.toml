[package]
name = "grapt-stateengine-ipc"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Client for a StateEngine host's local IPC protocol, version 1."

[dependencies]
grapt-stateengine-api = { path = "../grapt-stateengine-api" }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "time"] }
zeroize = "1.9"

# Directory-anchored, link-refusing reads of the host's private files.
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "test-util", "time"] }

[lints]
workspace = true
