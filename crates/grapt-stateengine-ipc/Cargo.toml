[package]
name = "grapt-stateengine-ipc"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Client for a StateEngine host's local IPC protocol, version 1."

[dependencies]
grapt-stateengine-api = { path = "../grapt-stateengine-api" }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }
zeroize = { workspace = true }

# Directory-anchored, link-refusing reads of the host's private files.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "std"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util", "time"] }

[lints]
workspace = true
