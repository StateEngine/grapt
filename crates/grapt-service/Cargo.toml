[package]
name = "grapt-service"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Owns service attribution and registration control, plus IA0-1R's one-attempt bounded authenticated health probe. The probe opens one literal HTTP endpoint but owns no listener, process lifecycle, desktop, provider, session or clock authority."

# The controller remains rooted in `grapt-types`. IA0-1R adds serde for the
# private wire mirror and narrowly-featured tokio for one bounded TCP probe;
# there is still no edge to `grapt-api` and no second canonical DTO owner.
[features]
# Tests that read the external frozen fixture corpus (`SECODE_FIXTURES`). The
# gates enable it; without it those tests are reported as ignored.
frozen-fixture = []

[[test]]
name = "integration"
path = "tests/integration/main.rs"

# Trybuild probes keep their own harness.
[[test]]
name = "compile_fail"
path = "tests/compile_fail.rs"

[dependencies]
grapt-types = { path = "../grapt-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "time"] }

[target.'cfg(unix)'.dependencies]
# DAILY-DRIVER-01: nonblocking/no-follow install-prefix lock open only.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# DAILY-DRIVER-01: retained install-lock identity; admitted by ruling.
same-file = "1.0"

[dev-dependencies]
# Integration tests do not inherit normal dependencies.
grapt-types = { path = "../grapt-types" }
# The corpus is JSON and JSONL. The owner PRODUCES expected/* from this crate's
# own model and compares exhaustively, so a reader that silently accepted a
# malformed row would defeat the comparison it exists to make.
serde_json = "1"
# The corpus owner validates this manifest against the ACTUAL ratified schema
# file, resolved through the frozen-fixture seam. Two of that schema's reachable
# constraints are `pattern`, so the evaluator needs a regex. `regex-lite` is
# already resolved in this workspace (grapt-session), so this edge adds no
# package to the lock.
regex-lite = "0.1"

# R4D-2C: rollback-after-commit is forbidden by ownership, so its witness must
# be a compile failure. `trybuild` is already resolved elsewhere in the
# workspace; the controller itself needs no external locking dependency.
trybuild = "1.0.120"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }

[lints]
workspace = true
