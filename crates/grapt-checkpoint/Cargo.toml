[package]
name = "grapt-checkpoint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Versioned provider-neutral workspace checkpoint capture, restore admission, and interrupted-effect reconciliation boundary."

[dependencies]
grapt-types = { path = "../grapt-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
toml = "0.8"

[lints]
workspace = true
