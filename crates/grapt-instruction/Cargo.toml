[package]
name = "grapt-instruction"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Instruction epochs domain: delta fold and content-address audit, with the measured three-way blob-hash law pinned against the real frozen clone."

[features]
# Tests that read the external frozen fixture corpus (`SECODE_FIXTURES`). The
# gates enable it; without it those tests are reported as ignored.
frozen-fixture = []

[dependencies]
grapt-types = { path = "../grapt-types" }
grapt-store = { path = "../grapt-store" }
grapt-event = { path = "../grapt-event" }
rusqlite = { workspace = true, features = ["bundled"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
