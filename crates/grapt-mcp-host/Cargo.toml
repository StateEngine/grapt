[package]
name = "grapt-mcp-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hosts MCP servers for the application: configuration, connection lifecycle, tool publication and content conversion."

[dependencies]
grapt-diagnostics = { path = "../grapt-diagnostics" }
base64 = { workspace = true }
grapt-provider = { path = "../grapt-provider" }
grapt-mcp = { path = "../grapt-mcp" }
grapt-mcp-client = { path = "../grapt-mcp-client" }
grapt-form = { path = "../grapt-form" }
serde_json = { workspace = true }
url = { workspace = true }
tokio = { workspace = true, features = ["time", "io-util", "rt", "sync", "macros"] }

[dev-dependencies]
grapt-mcp-client = { path = "../grapt-mcp-client", features = ["loopback-testkit"] }
tokio = { workspace = true, features = ["time", "io-util", "rt", "sync", "macros", "net"] }

[lints]
workspace = true
