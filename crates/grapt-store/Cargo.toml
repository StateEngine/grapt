[package]
name = "grapt-store"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Durable event store for the Grapt Rust reconstruction: read-only audit and replay over real TS-era databases first, write path second."

[dependencies]
sha2 = { workspace = true }
grapt-types = { path = "../grapt-types" }
grapt-event = { path = "../grapt-event" }
# `hooks` is what exposes `sqlite3_set_authorizer`. It is the enforcement the
# governed-write chokepoint is built on, without adding another crate.
rusqlite = { workspace = true, features = ["bundled", "backup", "hooks"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The workspace's only source of OS randomness, used by the named production
# identity adapter in `src/ids.rs`. Its ambient constructor `getrandom::fill` is
# on the workspace disallowed-methods list; that adapter is the single allowed
# call site, and `fixtures/negative/ambient-randomness` proves the entry fires.
#
# Lockfile effect, stated exactly rather than as "no new dependencies": TWO
# entries appear, `getrandom` and `r-efi`. Only `getrandom` is ever compiled on
# a supported target. `r-efi` is optional and doubly gated —
# `cfg(all(target_os = "uefi", getrandom_backend = "efi_rng"))` — so it enters
# no build graph here; `cargo tree -p grapt-store -i r-efi` finds nothing.
# Default features only: `std` and `sys_rng` are both opt-in and neither is
# enabled, so the `rand_core` re-export stays gated out, and the Windows backend
# calls `ProcessPrng` directly rather than through a platform crate.
getrandom = { workspace = true }
# Read-only filesystem-capacity observation for migration authorization. The
# crate's public API is safe; Grapt contains no platform FFI or unsafe block.
fs2 = { workspace = true }
# Stable safe handle identity on Windows and Unix. `same-file` owns the opened
# handle and compares the OS volume/file tuple without exposing platform FFI to
# Grapt; it was already locked transitively before this direct use.
same-file = { workspace = true }

[dev-dependencies]
# Compile-fail probes only, matching the pattern grapt-types/-event/-schema/
# -permission/-provider already use.
trybuild = { workspace = true }

[lints]
workspace = true

# Existing locked safe syscall owner; Darwin vnode notifications retain every ancestor
# across SQLite open so swap-and-restore cannot evade identity checks. Allowed-dependency
# attestation: SC-MAC-04. Existing locked MIT package; only retained-vnode path and event
# APIs admitted.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["fs", "event"] }
