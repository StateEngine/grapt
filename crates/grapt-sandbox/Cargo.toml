[package]
name = "grapt-sandbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Safe native containment adapter; terminal lifetime and authorization remain with the caller."

[dependencies]
grapt-types = { path = "../grapt-types" }
same-file = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["fs", "poll", "process", "signal", "user"] }
seccompiler = "=0.5.0"
rustix = { workspace = true, features = ["std", "process"] }
serde_json = { workspace = true }
signal-hook = "=0.3.18"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["fs", "poll", "process", "signal", "user"] }

[target.'cfg(windows)'.dependencies]
# Hidden inherited-console APIs are isolated in native.rs and guarded by a canary.
mxc-sdk = { version = "=1.0.1", default-features = false }
winreg = { workspace = true }
winapi-util = { workspace = true }

[lints]
workspace = true
