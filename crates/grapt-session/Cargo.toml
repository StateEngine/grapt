[package]
name = "grapt-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Session lifecycle projection: strict event decode and last-write-wins fold, verified field-by-field against the real frozen clone's 305 session rows."

[dependencies]
# The exclusion notice's identity is a digest of the complete original set:
# names come from external servers, so only the whole set tells two sets apart.
sha2 = { workspace = true }
grapt-types = { path = "../grapt-types" }
# Declared DIRECTLY rather than reached through `grapt-store`'s re-export.
# The store re-exports `AggregateId` alone, and the history fold decodes three
# payload contracts that live in `grapt-event`. Widening the store's
# re-export surface to carry them would make the store the owner of a
# vocabulary it does not own; the arrow below points DOWNWARD (store already
# depends on event), so it adds no cycle and no upward reach.
grapt-event = { path = "../grapt-event" }
grapt-store = { path = "../grapt-store" }
# The durable history read model, moved out along its own responsibility. The
# arrow points DOWN: history depends on event and store, never back on Session.
grapt-session-history = { path = "../grapt-session-history" }
rusqlite = { workspace = true, features = ["blob", "bundled", "functions"] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
# The acceptance-corpus gate validates the fixture manifest against the
# RATIFIED `fixtures/rust-reconstruction/manifest.schema.json` itself rather
# than against a second hand-written copy of its rules. That schema constrains
# three fields by `pattern`, so the gate needs a regular-expression engine to
# honour them. `regex-lite` is chosen over `regex` because it carries no
# transitive dependencies at all: this is a test-only gate and it must not
# widen the foundation workspace's dependency closure.
regex-lite = { workspace = true }

[lints]
workspace = true
