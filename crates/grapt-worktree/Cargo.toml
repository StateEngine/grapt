[package]
name = "grapt-worktree"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Bounded detached Git worktree creation shared by Grapt clients and product."

[dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "process", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
