[package]
name = "grapt-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native terminal interface for Grapt"

[dependencies]
grapt-cli = { path = "../grapt-cli" }
grapt-connections-catalog = { path = "../grapt-connections-catalog" }
grapt-plugin-prompt = { path = "../grapt-plugin-prompt" }
grapt-schema = { path = "../grapt-schema" }
url = { workspace = true }
grapt-image = { path = "../grapt-image" }
base64 = { workspace = true }
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
grapt-client = { path = "../grapt-client" }
grapt-tui-transcript = { path = "../grapt-tui-transcript" }
grapt-tui-forms = { path = "../grapt-tui-forms" }
grapt-types = { path = "../grapt-types" }
grapt-console = { path = "../grapt-console" }
grapt-api = { path = "../grapt-api" }
ratatui = { workspace = true, features = ["crossterm"] }
ratatui-textarea = { workspace = true, features = ["crossterm"] }
crossterm = { workspace = true, features = ["events", "bracketed-paste", "windows"] }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
tokio = { workspace = true, features = ["time", "rt", "net", "sync", "macros", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
crossterm_winapi = "=0.9.1"
clipboard-win = "=5.4.2"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "=0.13.2"

[dev-dependencies]
# The transcript's test-only views, for the TUI's integration tests only.
grapt-tui-transcript = { path = "../grapt-tui-transcript", features = ["test-support"] }
# The forms crate's read-only draft view, for the same tests.
grapt-tui-forms = { path = "../grapt-tui-forms", features = ["test-support"] }
