[package]
name = "grapt-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native terminal interface for Grapt"

[dependencies]
grapt-cli = { path = "../grapt-cli" }
grapt-connections = { path = "../grapt-connections" }
grapt-plugin = { path = "../grapt-plugin" }
grapt-schema = { path = "../grapt-schema" }
url = "2.5.8"
grapt-image = { path = "../grapt-image" }
base64 = "0.22.1"
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
grapt-client = { path = "../grapt-client" }
grapt-tui-transcript = { path = "../grapt-tui-transcript" }
grapt-tui-forms = { path = "../grapt-tui-forms" }
grapt-types = { path = "../grapt-types" }
grapt-console = { path = "../grapt-console" }
grapt-api = { path = "../grapt-api" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
ratatui-textarea = { version = "=0.9.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "bracketed-paste", "windows"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.1"
tokio = { version = "=1.53.3", default-features = false, features = ["time", "rt", "net", "sync", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
crossterm_winapi = "=0.9.1"
clipboard-win = "=5.4.2"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "=0.13.2"

[dev-dependencies]
# The transcript's test-only views, for the TUI's integration tests only.
grapt-tui-transcript = { path = "../grapt-tui-transcript", features = ["test-support"] }
# The forms crate's read-only draft view, for the same tests.
grapt-tui-forms = { path = "../grapt-tui-forms", features = ["test-support"] }
