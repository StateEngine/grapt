[package]
name = "grapt-plugin"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Authority-bound external plugin generations and the constrained JavaScript compatibility bridge."

[[test]]
name = "integration"
path = "tests/integration/main.rs"

# The envelope witness needs a process apart from the bridge fixtures.
[[test]]
name = "envelope"
path = "tests/envelope.rs"

[dependencies]
grapt-diagnostics = { path = "../grapt-diagnostics" }
grapt-sandbox = { path = "../grapt-sandbox" }
base64 = "0.22.1"
url = "2.5.8"
tempfile = "=3.27.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
grapt-types = { path = "../grapt-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time", "rt-multi-thread", "net", "sync", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["signal", "process", "user"] }

[target.'cfg(windows)'.dependencies]
processkit = { version = "=3.3.4", default-features = false, features = ["limits", "process-control"] }

[target.'cfg(windows)'.dev-dependencies]
windows-spawn = "=0.1.0"

[lints]
workspace = true
