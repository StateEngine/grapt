[package]
name = "grapt-plugin"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Authority-bound external plugin generations and the constrained JavaScript compatibility bridge."

[features]
loopback-testkit = []

[[test]]
name = "integration"
path = "tests/integration/main.rs"

# The envelope witness needs a process apart from the bridge fixtures.
[[test]]
name = "envelope"
path = "tests/envelope.rs"

[dependencies]
grapt-diagnostics = { path = "../grapt-diagnostics" }
grapt-plugin-prompt = { path = "../grapt-plugin-prompt" }
grapt-sandbox = { path = "../grapt-sandbox" }
grapt-web = { path = "../grapt-web" }
base64 = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true, features = ["rustls-no-provider", "http2"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { workspace = true }
grapt-types = { path = "../grapt-types" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sysinfo = { workspace = true, features = ["system"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "rt-multi-thread", "net", "sync", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["signal", "process", "user"] }

[target.'cfg(windows)'.dependencies]
processkit = { workspace = true, features = ["limits", "process-control"] }

[dev-dependencies]
grapt-plugin = { path = ".", features = ["loopback-testkit"] }

[target.'cfg(windows)'.dev-dependencies]
windows-spawn = { workspace = true, default-features = true }

[lints]
workspace = true
