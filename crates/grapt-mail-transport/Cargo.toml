[package]
name = "grapt-mail-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sealed remote-seat-mail-transport/v1 port, strict DTOs, authenticated loopback adapter and deterministic fake."

[dependencies]
grapt-diagnostics = { path = "../grapt-diagnostics" }
grapt-types = { path = "../grapt-types" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
reqwest = { workspace = true, features = ["rustls-no-provider", "http2"] }
# Reqwest's existing no-provider TLS feature requires an explicit provider even
# for a loopback-only client. This is the existing ring-backed workspace config;
# it never installs a process-global crypto provider.
rustls = { workspace = true, features = ["ring", "std", "tls12"] }

[lints]
workspace = true

[dev-dependencies]
trybuild = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time"] }
