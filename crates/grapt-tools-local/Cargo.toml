[package]
name = "grapt-tools-local"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Local tools the agent runs on this machine: terminals, patching, file search, checkpoints and the shell environment."

[dependencies]
ignore = { version = "=0.4.33", default-features = false }
regex = "=1.13.1"
ring = "0.17.14"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["time"] }

[lints]
workspace = true
