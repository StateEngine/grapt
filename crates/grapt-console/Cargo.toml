[package]
name = "grapt-console"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Console ownership for the native terminal interface: control events, signal state and close hygiene."

[dependencies]
crossterm = { workspace = true, features = ["events", "bracketed-paste", "windows"] }
tokio = { workspace = true, features = ["rt", "sync", "signal", "macros", "time"] }

[lints]
workspace = true
