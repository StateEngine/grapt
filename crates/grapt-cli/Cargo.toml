[package]
name = "grapt-cli"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bounded Rust CLI, noninteractive, and ACP client over the versioned Grapt API."

[[bin]]
name = "grapt"
path = "src/main.rs"

[features]
default = []
loopback-testkit = []

[[test]]
name = "integration"
path = "tests/integration/main.rs"

# Mutation runs and docs select these targets by name.
[[test]]
name = "contracts"
path = "tests/contracts.rs"

[[test]]
name = "ephemeral"
path = "tests/ephemeral.rs"

[[test]]
name = "mcp_commands"
path = "tests/mcp_commands.rs"

[[test]]
name = "public_seams"
path = "tests/public_seams.rs"

[dependencies]
globset = { workspace = true }
grapt-image = { path = "../grapt-image" }
grapt-connections = { path = "../grapt-connections" }
grapt-login = { path = "../grapt-login" }
grapt-worktree = { path = "../grapt-worktree" }
grapt-api = { path = "../grapt-api" }
grapt-schema = { path = "../grapt-schema" }
grapt-service = { path = "../grapt-service" }
grapt-types = { path = "../grapt-types" }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
yaml-rust2 = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
# Raw mode for no-echo API-key entry, confined to client/terminal/secret_input.rs. The
# same pinned version and features grapt-tui already admits, so the lockfile gains no
# entry.
crossterm = { workspace = true, features = ["bracketed-paste", "events", "windows"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, default-features = true, features = ["fs"] }
# O_NONBLOCK, so refusing a FIFO in place of a sign-in file cannot block.
libc = { workspace = true }

# Admitted by CLI-COMPATIBILITY-MATRIX-01 r2: the service owner is spawned with an
# explicit handle list, so it never holds a pipe its caller reads.
[target.'cfg(windows)'.dependencies]
windows-spawn = { workspace = true, default-features = true }
# Retained physical installer identities.
same-file = { workspace = true }
# Read-only prune identity/link counts.
winapi-util = { workspace = true }
# C10: safe, exact-pinned USER Path access and bounded-child notification.
winreg = { workspace = true }
windows-env = "=0.3.1"

[dev-dependencies]
# Tests never touch the production credential keystore entry or pointer.
grapt-login = { path = "../grapt-login", features = ["loopback-testkit"] }
# `test-util` lets launch-window tests advance the 30 s bound on a paused clock.
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

[lints]
workspace = true
