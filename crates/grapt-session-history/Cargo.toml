[package]
name = "grapt-session-history"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Session's durable history read model: a pure deterministic fold over recorded facts, and the bounded reads that feed it."

[dependencies]
grapt-types = { path = "../grapt-types" }
grapt-event = { path = "../grapt-event" }
grapt-store = { path = "../grapt-store" }
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[lints]
workspace = true
