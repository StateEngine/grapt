[package]
name = "grapt-run-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bounded SQLite writer and WAL snapshots for Grapt runs"

[dependencies]
fs2 = { workspace = true }
grapt-types = { path = "../grapt-types" }
rusqlite = { workspace = true, features = ["backup", "bundled", "extra_check", "hooks", "limits"] }
same-file = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[[example]]
name = "qualification"
test = false
