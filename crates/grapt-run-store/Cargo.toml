[package]
name = "grapt-run-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bounded SQLite writer and WAL snapshots for Grapt runs"

[dependencies]
fs2 = "0.4.3"
grapt-types = { path = "../grapt-types" }
rusqlite = { version = "=0.41.1", features = ["backup", "bundled", "extra_check", "hooks", "limits"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[[example]]
name = "qualification"
test = false
