[package]
name = "grapt-session-actor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Per-session runtime state actor persisted in a Grapt run store"

[dependencies]
grapt-run-store = { path = "../grapt-run-store" }
grapt-types = { path = "../grapt-types" }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
