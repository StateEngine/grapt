[package]
name = "grapt-web"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Bounded public-web fetching through a DNS-pinned HTTP adapter"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time", "rt", "sync"] }
htmd = "=0.5.4"
url = "2"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["time", "net", "rt", "macros", "io-util"] }

[lints]
workspace = true
