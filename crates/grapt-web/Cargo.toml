[package]
name = "grapt-web"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Bounded public-web fetching through a DNS-pinned HTTP adapter"

[dependencies]
reqwest = { workspace = true, features = ["rustls-no-provider", "http2"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "rt", "sync"] }
htmd = "=0.5.4"
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["time", "net", "rt", "macros", "io-util"] }

[lints]
workspace = true
