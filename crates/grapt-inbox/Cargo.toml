[package]
name = "grapt-inbox"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Durable input admission domain: strict event decode and pending fold, proven against the real frozen clone."

[[test]]
name = "integration"
path = "tests/integration/main.rs"

# Remote evidence runs this target by name, repeatedly, for concurrency.
[[test]]
name = "inbox_admission"
path = "tests/inbox_admission.rs"

[dependencies]
grapt-types = { path = "../grapt-types" }
grapt-store = { path = "../grapt-store" }
rusqlite = { workspace = true, features = ["bundled"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
