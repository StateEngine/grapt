[package]
name = "grapt-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Serialized attempt owner and supervisor: bounded provider handoff, prioritized tool-terminal drain, single cancellation owner, exactly one truthful Step terminal. Owns no transport and no durable schema."

[features]
loopback-testkit = []

[dependencies]
grapt-diagnostics = { path = "../grapt-diagnostics" }
grapt-artifact = { path = "../grapt-artifact" }
grapt-event = { path = "../grapt-event" }
grapt-inbox = { path = "../grapt-inbox" }
grapt-mail-transport = { path = "../grapt-mail-transport" }
grapt-provider = { path = "../grapt-provider" }
grapt-session = { path = "../grapt-session" }
grapt-store = { path = "../grapt-store" }
grapt-types = { path = "../grapt-types" }
thiserror = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
grapt-provider = { path = "../grapt-provider", features = ["deterministic-testkit", "loopback-testkit"] }
serde_json = { workspace = true }
trybuild = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "test-util"] }

[lints]
workspace = true
