[package]
name = "grapt-mcp-client"
autotests = false
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Bounded client-side MCP transport adapters; no durable or permission authority."

[features]
loopback-testkit = []

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
grapt-types = { path = "../grapt-types" }
bytes = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
grapt-mcp = { path = "../grapt-mcp" }
grapt-web = { path = "../grapt-web" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time", "io-util", "rt", "sync", "macros", "net"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["time", "rt", "macros", "net", "io-util", "process", "test-util"] }

[lints]
workspace = true
