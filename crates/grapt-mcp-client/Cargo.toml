[package]
name = "grapt-mcp-client"
autotests = false
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Bounded client-side MCP transport adapters; no durable or permission authority."

[features]
loopback-testkit = []

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
base64 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
url = { workspace = true }
serde = { workspace = true, features = ["derive"] }
grapt-types = { path = "../grapt-types" }
bytes = { workspace = true }
reqwest = { workspace = true, features = ["rustls-no-provider", "http2"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { workspace = true }
grapt-mcp = { path = "../grapt-mcp" }
grapt-web = { path = "../grapt-web" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "io-util", "rt", "sync", "macros", "net"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time", "rt", "macros", "net", "io-util", "process", "test-util"] }

[lints]
workspace = true
