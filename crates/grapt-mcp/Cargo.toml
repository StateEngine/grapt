[package]
name = "grapt-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The MCP protocol domain: bounded JSON-RPC framing, an exact initialize handshake, and validated tool discovery. It is pure: no transport, process, socket, clock or permission authority, and no workspace dependency."

[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The dependency-direction gate parses this crate's manifest AND the workspace
# root manifest structurally, so a dependency renamed once under
# [workspace.dependencies] is still resolved to the crate it really names.
toml = { workspace = true }

[lints]
workspace = true
