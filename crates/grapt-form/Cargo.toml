[package]
name = "grapt-form"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Form blocker domain: strict event decode and write-side service; suspension is non-terminal (answer/cancel settle it), the deliberate contrast to Permission."

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
grapt-types = { path = "../grapt-types" }
grapt-store = { path = "../grapt-store" }
rusqlite = { workspace = true, features = ["bundled"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The frozen answer validator enforces `format: "uri"` by WHATWG URL parse and
# `pattern` by regular expression, so honouring them needs both engines in the
# LIBRARY closure — this crate's validator runs in the product, not in a gate.
#
# `url` is already resolved at 2.5.8 in this workspace.
url = { workspace = true }
# `regress` implements ECMAScript RegExp semantics, which is the contract the
# frozen `pattern` constraint actually owes: the wire calls `new RegExp(pattern)`
# with NO flags, and in that mode JavaScript is NOT a Unicode-scalar engine.
# Measured against the oracle's JavaScript runtime 1.3.14, a general Rust engine disagrees on `\p{L}`
# (an identity escape without the `u` flag, matching the literal "p{L}"), on
# ASCII-only `\w`/`\d`, on `[]`/`[^]`, and on every astral character, because
# JavaScript matches UTF-16 CODE UNITS rather than scalar values. The `utf16`
# feature carries the UCS-2 surface that reproduces all of it.
regress = { version = "0.10", features = ["utf16"] }

[lints]
workspace = true
