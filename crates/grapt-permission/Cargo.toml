[package]
name = "grapt-permission"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Permission blocker domain: strict event decode and lifecycle fold, proven against the real frozen clone."

[[test]]
name = "integration"
path = "tests/integration/main.rs"

# Trybuild probes keep their own harness.
[[test]]
name = "compile_fail"
path = "tests/compile_fail.rs"

# Each evidence test must own its `mod evidence;`, and `integration` already has one.
[[test]]
name = "clone_permissions"
path = "tests/clone_permissions.rs"

[dependencies]
grapt-types = { path = "../grapt-types" }
grapt-store = { path = "../grapt-store" }
rusqlite = { workspace = true, features = ["bundled"] }
serde_json = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
rusqlite = { workspace = true, features = ["bundled"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
trybuild = { workspace = true }

[lints]
workspace = true
