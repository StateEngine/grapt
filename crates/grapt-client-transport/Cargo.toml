[package]
name = "grapt-client-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The client's transport, contract and wire layer: HTTP, the SSE reader, the frozen operation contract and DTO decoding."

[dependencies]
grapt-api = { path = "../grapt-api" }
grapt-types = { path = "../grapt-types" }
grapt-schema = { path = "../grapt-schema" }
serde_json = "1"
thiserror = "2"
# Scheduling clock only: no runtime, reactor, tasks or I/O features.
tokio = { version = "=1.53.3", default-features = false, features = ["time"] }

[dev-dependencies]
# The external-dependency gate parses this manifest structurally.
toml = "0.8"

[lints]
workspace = true
