[package]
name = "grapt-artifact"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Owns the bounded artifact capture/store seam only — pre-allocation bounds, content-addressed immutable write/fetch and identity/length/digest verification. It canonicalizes nothing, emits no event and owns no retention."

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
grapt-types = { path = "../grapt-types" }
sha2 = "0.10"

[lints]
workspace = true
