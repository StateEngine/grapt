[package]
name = "grapt-login"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Bounded provider sign-in and serialized credential renewal."

[features]
loopback-testkit = []

[dependencies]
async-trait = "0.1"
azure_core = { version = "=1.0.0", default-features = false }
azure_identity = { version = "=1.0.0", default-features = false, features = ["tokio"] }
google-cloud-auth = { version = "=1.18.0", default-features = false }
http = "1"
aws-config = { version = "=1.13.1", default-features = false, features = ["rt-tokio", "sso"] }
aws-credential-types = "=1.3.1"
aws-sigv4 = "=1.6.5"
aws-smithy-http-client = { version = "=1.5.2", features = ["rustls-ring", "rt-tokio"] }
aws-types = "=1.7.0"
base64 = { workspace = true }
getrandom = { workspace = true }
processkit = { workspace = true, features = ["process-control"] }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
ring = { workspace = true }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { workspace = true }
grapt-types = { path = "../grapt-types" }
same-file = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "net", "io-util"] }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

# The Secret Service over pure-Rust zbus: no libdbus, libsecret or OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "crypto-rust", "async-io"] }
# Named only to tell an absent Secret Service from one that refused.
secret-service = { version = "=4.0.0", default-features = false }
zbus = { version = "=4.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
# Named only to tell an absent keychain from one that refused.
security-framework = { version = "=3.7.0", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
