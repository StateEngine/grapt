[package]
name = "grapt-login"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Bounded provider sign-in and serialized credential renewal."

[features]
loopback-testkit = []

[dependencies]
async-trait = "0.1"
azure_core = { version = "=1.0.0", default-features = false }
azure_identity = { version = "=1.0.0", default-features = false, features = ["tokio"] }
google-cloud-auth = { version = "=1.18.0", default-features = false }
http = "1"
aws-config = { version = "=1.13.1", default-features = false, features = ["rt-tokio", "sso"] }
aws-credential-types = "=1.3.1"
aws-sigv4 = "=1.6.5"
aws-smithy-http-client = { version = "=1.5.2", features = ["rustls-ring", "rt-tokio"] }
aws-types = "=1.7.0"
base64 = "0.22.1"
getrandom = "0.4.3"
processkit = { version = "=3.3.4", default-features = false, features = ["process-control"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
grapt-types = { path = "../grapt-types" }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time", "net", "io-util"] }
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
