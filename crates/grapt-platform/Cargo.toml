[package]
name = "grapt-platform"
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Dogfood-0 platform bootstrap: first-contact store authority, published configuration, catalog issuance, and credential custody."

[[test]]
name = "integration"
path = "tests/integration/main.rs"

# Mutation manifests and the mutation inventory select this target by name.
[[test]]
name = "platform_vertical"
path = "tests/platform_vertical.rs"

[dependencies]
reqwest = { workspace = true }
grapt-config = { path = "../grapt-config" }
grapt-connections = { path = "../grapt-connections" }
grapt-login = { path = "../grapt-login" }
grapt-provider = { path = "../grapt-provider" }
grapt-store = { path = "../grapt-store" }
grapt-types = { path = "../grapt-types" }
same-file = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# Tests never touch the production credential keystore entry or pointer.
grapt-login = { path = "../grapt-login", features = ["loopback-testkit"] }
rusqlite = { workspace = true, features = ["bundled"] }

[lints]
workspace = true
