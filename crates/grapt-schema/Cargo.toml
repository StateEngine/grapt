[package]
name = "grapt-schema"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Strict, bounded JSON decoding and explicit field-presence vocabulary for Grapt wire and domain boundaries."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"

[dev-dependencies]
grapt-types = { path = "../grapt-types" }
trybuild = "1.0.120"

[lints]
workspace = true
