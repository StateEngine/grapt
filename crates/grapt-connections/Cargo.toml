[package]
name = "grapt-connections"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "A profile's provider connections: sign-in, replacement and their profile files."

[features]
loopback-testkit = ["grapt-login/loopback-testkit"]

[dependencies]
grapt-connections-catalog = { path = "../grapt-connections-catalog" }
grapt-config = { path = "../grapt-config" }
grapt-login = { path = "../grapt-login" }
grapt-types = { path = "../grapt-types" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# Tests never touch the production credential keystore entry or pointer.
grapt-login = { path = "../grapt-login", features = ["loopback-testkit"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
