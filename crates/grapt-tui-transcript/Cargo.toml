[package]
name = "grapt-tui-transcript"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The TUI's conversation rendering: transcript rows, markdown, highlighting, palette and turn footer."

[dependencies]
grapt-api = { path = "../grapt-api" }
grapt-client = { path = "../grapt-client" }
ratatui = { workspace = true, features = ["crossterm"] }
crossterm = { workspace = true, features = ["events", "bracketed-paste", "windows"] }
pulldown-cmark = { version = "=0.10.3", default-features = false }
syntect = { workspace = true, features = ["parsing", "default-themes", "regex-onig"] }
# The pinned dependencies own the native regex implementation and its FFI.
onig = { version = "=6.5.3", default-features = false }
onig_sys = { version = "=69.9.3", default-features = false }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
tokio = { workspace = true, features = ["time"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
syntect = { workspace = true, features = ["dump-create", "default-themes", "parsing", "regex-onig"] }
two-face = { workspace = true, features = ["syntect-onig"] }

[dev-dependencies]
two-face = { workspace = true, features = ["syntect-onig"] }

[features]
# Test-only views (visible rows, painted cells, scroll to top, markdown render)
# for the TUI's integration tests. Never enabled outside [dev-dependencies].
test-support = []

[lints]
workspace = true
