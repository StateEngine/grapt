[package]
name = "grapt-tui-transcript"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The TUI's conversation rendering: transcript rows, markdown, highlighting, palette and turn footer."

[dependencies]
grapt-api = { path = "../grapt-api" }
grapt-client = { path = "../grapt-client" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "bracketed-paste", "windows"] }
pulldown-cmark = { version = "=0.10.3", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "default-themes", "regex-onig"] }
# The pinned dependencies own the native regex implementation and its FFI.
onig = { version = "=6.5.3", default-features = false }
onig_sys = { version = "=69.9.3", default-features = false }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.1"
tokio = { version = "=1.53.3", default-features = false, features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde_json = "1"
syntect = { version = "=5.3.0", default-features = false, features = ["dump-create", "default-themes", "parsing", "regex-onig"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"] }

[dev-dependencies]
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"] }

[features]
# Test-only views (visible rows, painted cells, scroll to top, markdown render)
# for the TUI's integration tests. Never enabled outside [dev-dependencies].
test-support = []

[lints]
workspace = true
