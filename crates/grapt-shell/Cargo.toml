[package]
name = "grapt-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shell vocabulary the live terminal reports in, plus the shell tables a store written by an earlier build may still carry. Holds no service and no read path."

[dependencies]
grapt-store = { path = "../grapt-store" }
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"

[lints]
workspace = true
